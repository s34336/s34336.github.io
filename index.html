<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Supapit Chinnawut | Portfolio</title>

    <link rel="stylesheet" href="style.css">

    <style>

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .home-card {
            width: min(650px, 92%);
            background: rgba(255,255,255,0.94);
            border-radius: 38px;
            padding: 45px 30px;
            text-align: center;
            border: 3px solid #ffe0e7;
            box-shadow: 0 20px 55px rgba(188,130,150,0.18);
            animation: appear 0.9s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .welcome {
            font-family: 'Itim', cursive;
            color: #d47f9e;
            font-size: 43px;
            margin-bottom: 25px;
        }

        .profile-circle {
            width: 190px;
            height: 190px;
            margin: auto;
            padding: 7px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f2a8bf, #f6d5a8);
            animation: gentle 4s ease-in-out infinite;
        }

        @keyframes gentle {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        .profile-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid white;
        }

        .name {
            margin-top: 25px;
            color: #765d65;
            font-size: 27px;
            font-weight: 500;
        }

        .school-info {
            margin-top: 10px;
            line-height: 2;
            color: #776970;
        }

        .msep {
            display: inline-block;
            margin-top: 14px;
            padding: 7px 22px;
            border-radius: 30px;
            background: #fff0d9;
            color: #c68161;
        }

        .enter {
            display: inline-block;
            margin-top: 28px;
            padding: 14px 38px;
            border-radius: 35px;
            background: linear-gradient(135deg, #e79ab5, #d985a5);
            color: white;
            text-decoration: none;
            font-size: 18px;
            box-shadow: 0 8px 20px rgba(210,130,157,0.3);
            transition: 0.25s;
        }

        .enter:hover {
            transform: translateY(-5px) scale(1.03);
        }

        .mini {
            margin-top: 23px;
            color: #aa969d;
            font-family: 'Itim', cursive;
            font-size: 18px;
        }

    </style>
</head>

<body>

    <div class="decor one">♡</div>
    <div class="decor two">✦</div>
    <div class="decor three">🌸</div>
    <div class="decor four">♡</div>

    <main class="home-card">

        <h1 class="welcome">
            Welcome to My Portfolio ♡
        </h1>

        <div class="profile-circle">
            <img src="IMG_4594.jpeg" alt="รูปโปรไฟล์">
        </div>

        <h2 class="name">
            น.ส.สุภาพิชญ์ ชินวุฒิ
        </h2>

        <p class="school-info">
            กำลังศึกษาอยู่ชั้นมัธยมศึกษาปีที่ 6<br>
            แผนการเรียน MSEP<br>
            โรงเรียนบ้านบึง“อุตสาหกรรมนุเคราะห์”
        </p>

        <span class="msep">
            M.6 • MSEP ♡
        </span>

        <br>

        <a href="portfolio.html" class="enter">
            เข้าสู่ Portfolio ✦
        </a>

        <p class="mini">
            ✿ Thank you for visiting my portfolio ✿
        </p>

    </main>

</body>
</html>
