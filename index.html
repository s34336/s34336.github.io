<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supapit Chinnawut | My Portfolio</title>

    <link href="https://fonts.googleapis.com/css2?family=Itim&family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Kanit', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #fff0f8, #f3e8ff, #eaf5ff);
            color: #51445d;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
            overflow-x: hidden;
        }

        body::before {
            content: "✦";
            position: fixed;
            top: 8%;
            left: 10%;
            font-size: 35px;
            color: #d9a7e8;
            opacity: 0.7;
        }

        body::after {
            content: "♡";
            position: fixed;
            bottom: 10%;
            right: 10%;
            font-size: 55px;
            color: #e7a9cf;
            opacity: 0.7;
        }

        .home-card {
            width: 100%;
            max-width: 650px;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 35px;
            padding: 45px 30px;
            text-align: center;
            box-shadow: 0 15px 45px rgba(151, 111, 173, 0.18);
            border: 2px solid rgba(255, 255, 255, 0.9);
        }

        .welcome {
            font-family: 'Itim', cursive;
            color: #9b5fbd;
            font-size: 42px;
            margin-bottom: 25px;
        }

        .profile-frame {
            width: 190px;
            height: 190px;
            margin: auto;
            padding: 7px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f4a9d5, #bfa2e8);
            box-shadow: 0 8px 25px rgba(178, 120, 193, 0.25);
        }

        .profile-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid white;
        }

        .name {
            font-size: 27px;
            font-weight: 600;
            color: #76518c;
            margin-top: 25px;
        }

        .info {
            font-size: 17px;
            line-height: 2;
            margin-top: 8px;
            color: #6e6474;
        }

        .tag {
            display: inline-block;
            margin-top: 15px;
            padding: 7px 20px;
            background: #f4e3fb;
            color: #925bab;
            border-radius: 30px;
            font-size: 15px;
        }

        .enter-button {
            display: inline-block;
            margin-top: 28px;
            padding: 13px 35px;
            border-radius: 30px;
            background: linear-gradient(135deg, #d889c2, #9e7bd1);
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: 500;
            box-shadow: 0 8px 20px rgba(163, 115, 188, 0.25);
            transition: 0.25s;
        }

        .enter-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(163, 115, 188, 0.35);
        }

        .small-text {
            margin-top: 22px;
            font-size: 13px;
            color: #9b8da3;
        }

        @media (max-width: 600px) {
            .welcome {
                font-size: 34px;
            }

            .name {
                font-size: 23px;
            }

            .profile-frame {
                width: 165px;
                height: 165px;
            }
        }
    </style>
</head>

<body>

    <main class="home-card">

        <h1 class="welcome">Welcome to My Portfolio ♡</h1>

        <div class="profile-frame">
            <img src="IMG_4594.jpeg" alt="รูปโปรไฟล์">
        </div>

        <h2 class="name">น.ส.สุภาพิชญ์ ชินวุฒิ</h2>

        <p class="info">
            กำลังศึกษาอยู่ชั้นมัธยมศึกษาปีที่ 6<br>
            แผนการเรียน MSEP
        </p>

        <span class="tag">M.6 | MSEP | Science ♡</span>

        <br>

        <a href="portfolio.html" class="enter-button">
            เข้าสู่ Portfolio →
        </a>

        <p class="small-text">
            ✦ Thank you for visiting my portfolio ✦
        </p>

    </main>

</body>
</html>
