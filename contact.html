<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | Portfolio</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .contact-list {
            max-width: 650px;
            margin: auto;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 20px;
            margin-bottom: 16px;
            background: #fffaf5;
            border: 2px solid #ffe1e7;
            border-radius: 22px;
            transition: 0.25s;
        }

        .contact-item:hover {
            transform: translateX(7px);
            background: #fff4f1;
        }

        .contact-icon {
            width: 55px;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #ffe8ed;
            font-size: 27px;
            flex-shrink: 0;
        }

        .contact-item h2 {
            color: #c97896;
            font-size: 18px;
        }

        .contact-item p {
            color: #75666c;
            margin-top: 2px;
            word-break: break-word;
        }

        .thanks {
            text-align: center;
            margin-top: 35px;
            font-family: 'Itim', cursive;
            color: #c97896;
            font-size: 27px;
        }

    </style>
</head>

<body>

                        📷
